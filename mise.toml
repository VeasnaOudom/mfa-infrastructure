[env]
_.file = ".env"

[tasks.start]
description = "Generate runtime files, build Keycloak image, and start stack"
run = '''
#!/usr/bin/env bash
set -euo pipefail

# 1. Run Ansible to generate runtime files and build the custom Keycloak image
if [ -f ansible/playbook.yml ] && [ -f ansible/group_vars/all/vault.yml ]; then
  docker compose -f setup-docker-compose.yml run --rm ansible-ee \
    ansible-playbook ansible/playbook.yml --tags vault,certs,env,build
fi

# 2. Create keycloak-providers/ and build the provider JAR into it so the
#    bind mount at /opt/keycloak/providers is populated before Keycloak starts
mise run build:keycloak-providers

# 3. Source environment and bring up stack
set -a; source .env; set +a
docker compose up -d

echo "--------------------------------------------------------"
echo "Keycloak:    https://${KEYCLOAK_HOST}"
echo "PrivacyIDEA: https://${PI_HOST}"
echo "Mail:        https://${SMTP4DEV_HOST}"
echo "Traefik:     http://localhost:${TRAEFIK_DASHBOARD_PORT}"
echo "--------------------------------------------------------"

# 4. Notify user about manual DB restore
latest_db="$(ls -t databases/*.tar.gz 2>/dev/null | head -n1 || true)"
if [ -n "$latest_db" ] && [ -f "$latest_db" ]; then
  echo ""
  echo "=> A database backup is available at:"
  echo "   $latest_db"
  echo "=> To restore this backup into MariaDB, run:"
  echo "   mise run db:restore $latest_db"
fi
'''
[tasks."start:services"]
description = "Start docker compose"
run = "docker compose up -d"

[tasks.down]
description = "Stop and remove the stack (keeps volumes)"
run = "docker compose down"

[tasks.stop]
description = "Stop the stack"
run = "docker compose stop"

[tasks."stop:keycloak"]
description = "Stop keycloak"
run = "docker compose stop keycloak"

[tasks."stop:mariadb"]
description = "Stop mariadb"
run = "docker compose stop mariadb"

[tasks."stop:pi"]
description = "Stop privacy-idea"
run = "docker compose stop privacyidea"

[tasks."stop:mail"]
description = "Stop smtp4dev"
run = "docker compose stop smtp4dev"

[tasks."start:mariadb"]
description = "start mariadb"
run = "docker compose start mariadb"

[tasks."start:pi"]
description = "start privacy-idea"
run = "docker compose start privacyidea"

[tasks."start:mail"]
description = "start smtp4dev"
run = "docker compose start smtp4dev"

[tasks.restart]
description = "Restart the stack"
run = "docker compose restart"

[tasks."logs:keycloak"]
description = "Follow keycloak logs"
run = "docker logs -f mfa-keycloak"

[tasks."logs:privacyidea"]
description = "Follow privacyidea logs"
run = "docker logs -f mfa-privacyidea"

[tasks."logs:mariadb"]
description = "Follow mariadb logs"
run = "docker logs -f mfa-mariadb"

[tasks."logs:mail"]
description = "Follow smtp4dev logs"
run = "docker logs -f smtp4dev"

[tasks.ps]
description = "List stack containers"
run = "docker compose ps"

[tasks.pull]
description = "Pull all images"
run = "docker compose pull"

[tasks.destroy]
description = "Stop and remove the stack, volumes, generated files, and database backups"
alias = "clean"
run = '''
#!/usr/bin/env bash
set -euo pipefail
docker compose down -v
rm -f certs/wildcard.crt certs/wildcard.key certs/truststore/*.crt
rm -f config/mariadb/conf.d/*.cnf
rm -f themes/khalibre/email/theme.properties
rm -f Dockerfile
rm -rf keycloak-providers
rm -rf databases/*.tar.gz
echo "Removed stack, volumes, generated files, and database backups."
'''

[tasks."telegram:init"]
description = "Start the Telegram bot's long poll, which nothing does on boot (wait for Keycloak first)"
run = '''
#!/usr/bin/env bash
set -euo pipefail

# The bot does not start itself: postInit is deliberately a no-op, so after every restart Keycloak is
# up and serving while the bot is silent. Nothing logs that - the first symptom is a user who scanned
# the QR code and saw no phone prompt, which reads as a broken link rather than a bot that never woke
# up. Every task here that restarts Keycloak calls this one; a bare `docker restart mfa-keycloak` still
# needs it by hand.
#
# Polling is safe to start twice - TelegramBotManager.startPolling returns early when the alias is
# already registered - so this is also the manual retry if the bot ever wedges.
set -a; source .env; set +a
realm="$(docker exec mfa-mariadb mariadb -uroot -p"${MYSQL_ROOT_PASSWORD}" -N -B \
  -e "SELECT NAME FROM ${KEYCLOAK_DB_NAME}.REALM WHERE ACCOUNT_THEME IS NOT NULL LIMIT 1;" \
  2>/dev/null | head -n1 || true)"
if [ -z "${realm}" ]; then
  realm=EDC
  echo "==> Could not read the realm from the database; assuming ${realm}."
fi

echo "==> Waiting for Keycloak..."
for _ in $(seq 1 60); do
  if curl -skf -o /dev/null "https://${KEYCLOAK_HOST}/realms/${realm}/.well-known/openid-configuration"; then
    break
  fi
  sleep 2
done

echo "==> Starting the Telegram bot..."
curl -sk -X POST "https://${KEYCLOAK_HOST}/realms/${realm}/telegram-auth/telegram/init"
echo ""
echo "   Watch for: [TelegramBotManager] Started polling for bot: telegram"
'''

[tasks."start:keycloak"]
description = "Start Keycloak service"
run = '''
#!/usr/bin/env bash
set -euo pipefail
mise run build:keycloak
mise run build:keycloak-providers
docker compose up -d keycloak
mise run telegram:init
'''

[tasks."build:keycloak"]
description = "Render Dockerfile and build custom Keycloak image with PrivacyIDEA provider via Ansible"
run = '''
#!/usr/bin/env bash
set -euo pipefail
docker compose -f setup-docker-compose.yml run --rm ansible-ee \
  ansible-playbook ansible/playbook.yml --tags build
'''

[tasks."start:privacyidea"]
description = "Start PrivacyIDEA service"
run = "docker compose up -d privacyidea"
[tasks."db:export"]
description = "Take a full physical MariaDB backup (mariabackup) of the entire data directory"
run = '''
#!/usr/bin/env bash
set -euo pipefail
set -a; source .env; set +a

if ! docker exec mfa-mariadb sh -c 'command -v mariabackup >/dev/null 2>&1'; then
  echo "Error: 'mariabackup' not found in mfa-mariadb (image: ${MARIADB_IMAGE})."
  echo "This image may not include the mariadb-backup package."
  exit 1
fi

mkdir -p databases/export
timestamp=$(date +"%Y%m%d_%H%M%S")
backup_dir="/tmp/mariabackup_${timestamp}"
tarfile="databases/export/mariadb_fullbackup_${timestamp}.tar.gz"

echo "Taking full physical backup..."
docker exec mfa-mariadb mariabackup \
  --backup \
  --target-dir="${backup_dir}" \
  --user=root \
  --password="${MYSQL_ROOT_PASSWORD}"

echo "Preparing backup (applying redo logs so it's restore-ready)..."
docker exec mfa-mariadb mariabackup \
  --prepare \
  --target-dir="${backup_dir}"

echo "Compressing to ${tarfile}..."
docker exec mfa-mariadb tar -czf "${backup_dir}.tar.gz" -C "$(dirname "${backup_dir}")" "$(basename "${backup_dir}")"
docker cp "mfa-mariadb:${backup_dir}.tar.gz" "${tarfile}"

echo "Cleaning up temp files inside container..."
docker exec mfa-mariadb rm -rf "${backup_dir}" "${backup_dir}.tar.gz"

echo "Full backup complete: ${tarfile}"
'''

[tasks."db:restore"]
description = "Restore MariaDB databases from a compressed tar.gz file (supports both mariabackup and SQL dumps)"
run = '''
#!/usr/bin/env bash
set -euo pipefail
set -a; source .env; set +a

if [ $# -eq 0 ]; then
  infile="$(ls -t databases/*.tar.gz 2>/dev/null | head -n1)"
  if [ -z "${infile}" ]; then
    echo "Error: No backup file given and none found in databases/"
    echo "Usage: mise run db:restore [backup_file.tar.gz]"
    exit 1
  fi
  echo "No file specified — using most recent backup: ${infile}"
else
  infile="$1"
fi

if [ ! -f "${infile}" ]; then
  echo "Error: File not found: ${infile}"
  exit 1
fi

echo "Inspecting backup format in ${infile}..."
is_physical="false"
if tar -ztf "${infile}" 2>/dev/null | grep -E "xtrabackup_checkpoints|backup-my.cnf" | head -n1 | grep -q .; then
  is_physical="true"
fi

if [ "${is_physical}" = "true" ]; then
  echo "Detected physical backup (mariabackup)."

  backup_entry=$(tar -ztf "${infile}" 2>/dev/null | awk -F/ 'NR==1{print $1}')

  echo "Stopping services..."
  docker compose stop keycloak privacyidea mariadb || true

  echo "Restoring physical backup directly to MariaDB volume..."
  docker run --rm \
    -v multifactor-authentication_mariadb-data:/var/lib/mysql \
    -v "$(readlink -f "${infile}"):/tmp/backup.tar.gz:ro" \
    "${MARIADB_IMAGE}" \
    bash -c "
      set -euo pipefail
      echo 'Extracting backup archive...'
      mkdir -p /tmp/mariabackup_restore
      tar -xzf /tmp/backup.tar.gz -C /tmp/mariabackup_restore

      target_dir=\"/tmp/mariabackup_restore\"
      if [ -d \"/tmp/mariabackup_restore/${backup_entry}\" ]; then
        target_dir=\"/tmp/mariabackup_restore/${backup_entry}\"
      fi

      echo 'Emptying existing data directory...'
      find /var/lib/mysql -mindepth 1 -delete

      echo 'Copying backup files...'
      mariabackup --copy-back --target-dir=\"\${target_dir}\"

      echo 'Setting ownership...'
      chown -R mysql:mysql /var/lib/mysql
      rm -rf /tmp/mariabackup_restore
    "

  echo "Starting MariaDB container..."
  docker compose start mariadb

else
  echo "Detected logical SQL backup."
  tmp_sql="$(mktemp --suffix=.sql)"
  trap 'rm -f "${tmp_sql}"' EXIT
  tar -xzvOf "${infile}" > "${tmp_sql}"

  for db in "${KEYCLOAK_DB_NAME}" "${PI_DB_NAME}"; do
    echo "  -> restoring ${db} (system tables always skipped)..."
    docker exec -i mfa-mariadb mariadb -uroot -p"${MYSQL_ROOT_PASSWORD}" --one-database "${db}" < "${tmp_sql}"
  done
fi

echo "Restore complete. Waiting for mfa-mariadb to report healthy..."
for i in $(seq 1 30); do
  status="$(docker inspect mfa-mariadb 2>/dev/null | jq -r '.[0].State.Health.Status // "starting"')"
  if [ "${status}" = "healthy" ]; then
    echo "mfa-mariadb is healthy."
    echo "Restarting application services..."
    docker compose start keycloak privacyidea || true
    exit 0
  fi
  sleep 2
done

echo "Warning: mfa-mariadb did not report healthy within 60s — check 'docker logs mfa-mariadb'."
'''

[tasks."build:keycloak-provider"]
description = "Build the Keycloak provider JAR (runs tests and assembles into keycloak-provider/build/libs)"
run = '''
#!/usr/bin/env bash
set -euo pipefail
( cd keycloak-provider && ./gradlew --console=plain build )
echo ""
echo "=> Built provider JAR:"
ls -1 keycloak-provider/build/libs/*.jar
'''

[tasks."build:keycloak-providers"]
description = "Create keycloak-providers/ and build the provider JAR and the khalibre-account-ui theme JAR into it (the folder bind-mounted at /opt/keycloak/providers)"
run = '''
#!/usr/bin/env bash
set -euo pipefail

mkdir -p keycloak-providers

if [ -d keycloak-provider ]; then
  ( cd keycloak-provider && ./gradlew --console=plain assemble )
  provider_jar="$(ls -1t keycloak-provider/build/libs/*.jar | head -n1)"
  cp -f "${provider_jar}" "keycloak-providers/$(basename "${provider_jar}")"
else
  echo "keycloak-provider/ not found — skipping provider build."
fi

pi_provider_version="$(awk -F': *' '/^privacyidea_provider_version:/ {gsub(/"/, "", $2); print $2; exit}' ansible/group_vars/all/vars.yml)"
if [ -n "${pi_provider_version}" ]; then
  command -v curl >/dev/null 2>&1 || { echo "Error: curl not found."; exit 1; }
  curl -fL \
    "https://github.com/privacyidea/keycloak-provider/releases/download/v${pi_provider_version}/PrivacyIDEA-Keycloak-Provider-${pi_provider_version}.jar" \
    -o keycloak-providers/PrivacyIDEA-Provider.jar
fi

mise run build:khalibre-account-ui

echo ""
echo "=> keycloak-providers/:"
ls -1 keycloak-providers
'''

[tasks."build:khalibre-account-ui"]
description = "Build the khalibre-account-ui theme JAR into target/ and copy it to keycloak-providers/"
run = '''
#!/usr/bin/env bash
set -euo pipefail

# mise tasks do not inherit the interactive shell, so nvm-managed node is missing.
if ! command -v npm >/dev/null 2>&1; then
  export NVM_DIR="${NVM_DIR:-$HOME/.nvm}"
  # shellcheck disable=SC1091
  [ -s "${NVM_DIR}/nvm.sh" ] && . "${NVM_DIR}/nvm.sh"
fi
command -v npm >/dev/null 2>&1 || { echo "Error: npm not found (nvm not loaded)."; exit 1; }

# @swc/core refuses to load its native binding when its cache root is group-writable, which fails
# the build with "Failed to load native binding". Default to a private directory under $HOME.
export SWC_NATIVE_BINDING_CACHE="${SWC_NATIVE_BINDING_CACHE:-$HOME/.swc-cache}"

cd khalibre-account-ui

npm ci --no-audit --no-fund 2>/dev/null || npm install --no-audit --no-fund
npm run build

# target/ is what Maven packages, and vite empties only dist/, so every build leaves the previous
# build's hashed chunks behind in it. Fourteen generations of MfaChannels-*.js once shipped that way,
# and the newest source change was absent from all of them - the page silently served a build from
# weeks earlier. Clearing target/ makes the JAR match the source by construction.
rm -rf target

mvn -q package -DskipTests -Dskip.installnodenpm -Dskip.npm

cd ..
mkdir -p keycloak-providers
jar_file="$(ls -1t khalibre-account-ui/target/khalibre-account-ui-*.jar | head -n1)"
cp -f "${jar_file}" "keycloak-providers/$(basename "${jar_file}")"

echo ""
echo "=> Built theme JAR: ${jar_file}"
echo "=> Copied to: keycloak-providers/$(basename "${jar_file}")"
'''

[tasks."build:khalibre-admin-ui"]
description = "Build the khalibre-admin-ui theme JAR (downloads the pinned Keycloak console source on first run) into target/ and copy it to keycloak-providers/"
run = '''
#!/usr/bin/env bash
set -euo pipefail

# The admin console is a React app with no plugin hook, so our page is patched into a pinned checkout
# of Keycloak's own JS sources and built there - see khalibre-admin-ui/scripts/patch-admin-ui.mjs.
# That checkout is a build input, not a dependency of this repository, so it is fetched on first use
# into build/ (gitignored) and then reused. KEYCLOAK_JS_DIR overrides it, e.g. to point at a checkout
# you already have; the fetch is skipped whenever the directory it names exists.
KC_VERSION=26.1.3
KC_DIR="${KEYCLOAK_JS_DIR:-build/keycloak-${KC_VERSION}}"
KC_JS="${KC_DIR}/js"
KC_ZIP="${KC_DIR}.zip"

if [ ! -d "${KC_JS}/apps/admin-ui" ]; then
  echo "==> Fetching the Keycloak ${KC_VERSION} console sources (~50MB, once)..."
  mkdir -p "$(dirname "${KC_DIR}")"
  if [ ! -f "${KC_ZIP}" ]; then
    curl -fsSL -o "${KC_ZIP}" \\
      "https://github.com/keycloak/keycloak/archive/refs/tags/${KC_VERSION}.zip"
  fi
  # The archive unpacks to keycloak-<version>/; -j keeps the archive next to it rather than inside.
  unzip -q -o "${KC_ZIP}" -d "$(dirname "${KC_DIR}")"
fi

[ -d "${KC_JS}/apps/admin-ui" ] || { echo "Error: no admin-ui under ${KC_JS}"; exit 1; }

# mise tasks do not inherit the interactive shell, so nvm-managed node is missing.
if ! command -v node >/dev/null 2>&1; then
  export NVM_DIR="${NVM_DIR:-$HOME/.nvm}"
  # shellcheck disable=SC1091
  [ -s "${NVM_DIR}/nvm.sh" ] && . "${NVM_DIR}/nvm.sh"
fi
command -v node >/dev/null 2>&1 || { echo "Error: node not found (nvm not loaded)."; exit 1; }

# pnpm is pinned by the checkout's packageManager field, so corepack resolves the right version
# rather than whatever happens to be on PATH.
export COREPACK_ENABLE_DOWNLOAD_PROMPT=0
pnpm_cmd=(corepack pnpm)

if [ ! -d "${KC_JS}/node_modules" ]; then
  echo "==> Installing the console's dependencies (once, this is the slow part)..."
  ( cd "${KC_JS}" && "${pnpm_cmd[@]}" install --frozen-lockfile )
fi

# Copies src/mfa into the checkout and patches the route table, the sidebar and the output
# directory. Idempotent, so this runs on every build.
( cd khalibre-admin-ui && npm run patch )

echo "==> Building the console..."
# The Vite build carries vite-plugin-checker, so the console's tsconfig type-checks the page under
# `strict: true` while it bundles. A type error fails here rather than in a console that ICT sees.
# Vite writes to khalibre-admin-ui/target/console, which is outside its root, so it cannot empty
# it: each build leaves the last one's hashed chunks behind and the theme JAR grows by megabytes of
# dead code. Clear it first. It must be cleared BEFORE the vite build, not after - clearing it
# afterwards deletes the output the build just produced and packages an empty theme, which is a
# console with no page at all rather than a stale one.
rm -rf khalibre-admin-ui/target

# ...and wireit's cache has to go with it. This is not tidiness: wireit decides whether to re-run from
# the files it declares, and the directory the build actually writes to is not one of them - the
# patch script points vite's outDir at khalibre-admin-ui/target/console while the script's own
# `output` still names an upstream path. So deleting the output leaves wireit convinced the build is
# up to date, it skips the build, and the task fails on a missing manifest - which looks exactly like
# a broken checkout rather than a stale cache.
rm -rf "${KC_JS}/apps/admin-ui/.wireit"

( cd "${KC_JS}/apps/admin-ui" && "${pnpm_cmd[@]}" build )

[ -f khalibre-admin-ui/target/console/.vite/manifest.json ] || {
  echo "Error: the console build produced no manifest - check the output above."; exit 1; }

mvn -q -f khalibre-admin-ui/pom.xml package -DskipTests

mkdir -p keycloak-providers
jar_file="$(ls -1t khalibre-admin-ui/target/khalibre-admin-ui-*.jar | head -n1)"
cp -f "${jar_file}" "keycloak-providers/$(basename "${jar_file}")"

echo ""
echo "=> Built theme JAR: ${jar_file}"
echo "=> Copied to: keycloak-providers/$(basename "${jar_file}")"
echo ""
echo "The console now runs this theme, so pick it for a realm (Realm settings -> Admin theme,"
echo "or PUT /admin/realms/<realm> with an adminTheme of khalibre-admin) and restart Keycloak."
'''

[tasks."deploy:admin-ui"]
description = "Build the khalibre-admin-ui theme and restart Keycloak to load it"
run = '''
#!/usr/bin/env bash
set -euo pipefail
mise run build:khalibre-admin-ui
echo "==> Restarting Keycloak to load the new admin console theme..."
docker restart mfa-keycloak
mise run telegram:init
echo ""
echo "=> Deployment complete. Keycloak is restarting."
echo "   Watch logs with:  mise run logs:keycloak"
'''

[tasks."deploy:khalibre-account-ui"]
description = "Build the khalibre-account-ui theme and restart Keycloak to load it"
run = '''
#!/usr/bin/env bash
set -euo pipefail
mise run build:khalibre-account-ui
echo "==> Restarting Keycloak to load the new account UI theme..."
docker restart mfa-keycloak
mise run telegram:init
echo ""
echo "=> Deployment complete. Keycloak is restarting."
echo "   Watch logs with:  mise run logs:keycloak"
'''

[tasks."dev:account-ui"]
description = "Run khalibre-account-ui in local mode: Vite dev server with HMR, served by the running Keycloak"
run = '''
#!/usr/bin/env bash
set -euo pipefail

# mise tasks do not inherit the interactive shell, so nvm-managed node is missing.
if ! command -v npm >/dev/null 2>&1; then
  export NVM_DIR="${NVM_DIR:-$HOME/.nvm}"
  # shellcheck disable=SC1091
  [ -s "${NVM_DIR}/nvm.sh" ] && . "${NVM_DIR}/nvm.sh"
fi
command -v npm >/dev/null 2>&1 || { echo "Error: npm not found (nvm not loaded)."; exit 1; }

# 1. Point Keycloak at the Vite dev server (KC_ACCOUNT_VITE_URL) and recreate it
echo "==> Enabling account UI dev mode (KC_ACCOUNT_VITE_URL)..."
docker compose -f docker-compose.yml -f docker-compose.dev-account-ui.yml up -d keycloak

# 2. Install dependencies once
cd khalibre-account-ui
if [ ! -d node_modules ]; then
  echo "==> Installing dependencies..."
  npm ci --no-audit --no-fund || npm install --no-audit --no-fund
fi

# 3. Run Vite, bound to 0.0.0.0 so it is reachable from the browser
set -a; source ../.env; set +a
realm_hint="$(docker exec mfa-mariadb mariadb -uroot -p"${MYSQL_ROOT_PASSWORD}" -N -B \
  -e "SELECT realm FROM ${KEYCLOAK_DB_NAME}.REALM ORDER BY name LIMIT 1;" 2>/dev/null || true)"
echo "--------------------------------------------------------"
if [ -n "$realm_hint" ]; then
  echo "Account console: https://${KEYCLOAK_HOST}/realms/${realm_hint}/account"
else
  echo "Account console: https://${KEYCLOAK_HOST}/realms/<realm>/account"
fi
echo "Vite dev server: http://localhost:5173 (loaded BY the account page, never open it directly)"
echo "Leave dev mode:  mise run dev:account-ui:stop"
echo "--------------------------------------------------------"
exec npm run dev -- --host 0.0.0.0 --strictPort
'''

[tasks."dev:account-ui:stop"]
description = "Leave account UI dev mode and serve the bundled theme JAR again"
run = '''
#!/usr/bin/env bash
set -euo pipefail
docker compose -f docker-compose.yml up -d --force-recreate keycloak
echo ""
echo "=> Keycloak recreated without KC_ACCOUNT_VITE_URL (bundled theme JAR)."
'''

[tasks."deploy:keycloak-provider"]
description = "Build the provider JAR and deploy it into the running Keycloak container"
run = '''
#!/usr/bin/env bash
set -euo pipefail

# 1. Build the provider
echo "==> Building keycloak-provider..."
( cd keycloak-provider && ./gradlew --console=plain build )
mkdir -p keycloak-providers
provider_jar="$(ls -1t keycloak-provider/build/libs/*.jar | head -n1)"
cp -f "${provider_jar}" "keycloak-providers/$(basename "${provider_jar}")"

# 2. The JAR is already visible inside the container via the bind mount
#    at /opt/keycloak/providers, so just restart Keycloak to load it.
echo "==> Restarting Keycloak to load the new provider..."
docker restart mfa-keycloak
mise run telegram:init

echo ""
echo "=> Deployment complete. Keycloak is restarting."
echo "=> Watch logs with:  mise run logs:keycloak"
'''
