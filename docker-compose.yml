---
name: multifactor-authentication

services:
  #
  # Reverse proxy
  # Dashboard: http://localhost:${TRAEFIK_DASHBOARD_PORT}
  #
  traefik:
    image: ${TRAEFIK_IMAGE}
    container_name: mfa-traefik
    restart: unless-stopped
    command:
      - '--api.insecure=true'
      - '--entrypoints.web.address=:80'
      - '--entrypoints.websecure.address=:443'
      - '--entrypoints.websecure.forwardedHeaders.insecure'
      - '--providers.docker=true'
      - '--providers.docker.exposedbydefault=false'
      - '--providers.docker.constraints=Label(`multifactor-authentication.project`,`true`)'
      - '--providers.file.directory=/etc/traefik/dynamic'
    ports:
      - '${TRAEFIK_HTTP_PORT}:80'
      - '${TRAEFIK_HTTPS_PORT}:443'
      - '${TRAEFIK_DASHBOARD_PORT}:8080'
    volumes:
      - '/var/run/docker.sock:/var/run/docker.sock:ro'
      - './config/traefik:/etc/traefik/dynamic:ro'
      - './certs:/certs:ro'
    networks:
      mfa-network:
        ipv4_address: 10.100.100.10

  smtp4dev:
    image: ${SMTP4DEV_IMAGE}
    container_name: mfa-smtp4dev
    restart: unless-stopped
    environment:
      ServerOptions__BasePath: '/'
      ServerOptions__Urls: 'http://*:80'
    labels:
      - 'multifactor-authentication.project=true'
      - 'traefik.enable=true'
      - 'traefik.http.middlewares.redirect-middleware.redirectscheme.scheme=https'
      - 'traefik.http.routers.smtp4dev-secure.entrypoints=websecure'
      - 'traefik.http.routers.smtp4dev-secure.rule=Host(`${SMTP4DEV_HOST}`)'
      - 'traefik.http.routers.smtp4dev-secure.service=smtp4dev-secure'
      - 'traefik.http.routers.smtp4dev-secure.tls=true'
      - 'traefik.http.routers.smtp4dev.entrypoints=web'
      - 'traefik.http.routers.smtp4dev.middlewares=redirect-middleware'
      - 'traefik.http.routers.smtp4dev.rule=Host(`${SMTP4DEV_HOST}`)'
      - 'traefik.http.routers.smtp4dev.service=smtp4dev'
      - 'traefik.http.services.smtp4dev-secure.loadbalancer.server.port=80'
      - 'traefik.http.services.smtp4dev.loadbalancer.server.port=80'
    depends_on:
      - 'traefik'
    volumes:
      - 'smtp4dev-data:/smtp4dev'
    networks:
      - mfa-network
  #
  # MariaDB database (Keycloak + PrivacyIDEA)
  #
  mariadb:
    image: ${MARIADB_IMAGE}
    container_name: mfa-mariadb
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${KEYCLOAK_DB_NAME}
      MYSQL_USER: ${KEYCLOAK_DB_USER}
      MYSQL_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      PI_DB_NAME: ${PI_DB_NAME}
      PI_DB_USER: ${PI_DB_USER}
      PI_DB_PASSWORD: ${PI_DB_PASSWORD}
      MARIADB_AUTO_UPGRADE: 1
    ports:
      - '${MARIADB_PORT}:3306'
    volumes:
      - 'mariadb-data:/var/lib/mysql'
      - './config/mariadb/initdb:/docker-entrypoint-initdb.d:ro'
      - './config/mariadb/conf.d:/etc/mysql/conf.d:ro'
    networks:
      - mfa-network
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

  #
  # Keycloak
  # URL: https://${KEYCLOAK_HOST}
  #
  keycloak:
    image: ${KEYCLOAK_IMAGE}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mfa-keycloak
    restart: unless-stopped
    command: start-dev
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_DB: mariadb
      KC_DB_URL_HOST: mariadb
      KC_DB_URL_DATABASE: ${KEYCLOAK_DB_NAME}
      KC_DB_USERNAME: ${KEYCLOAK_DB_USER}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      KC_PROXY_HEADERS: xforwarded
      KC_HOSTNAME: ${KEYCLOAK_HOST}
      KC_HOSTNAME_STRICT: 'false'
      PI_ADMIN_USER: ${PI_ADMIN_USER}
      PI_ADMIN_PASSWORD: ${PI_ADMIN_PASSWORD}
      # Shared secret required by the privacyIDEA webhook and resend endpoints
      PRIVACYIDEA_WEBHOOK_SECRET: ${PRIVACYIDEA_WEBHOOK_SECRET}
      # Public origin email clients use to load theme assets (logo, images). Must differ per
      # environment; defaults to https://${KEYCLOAK_HOST} when unset.
      KEYCLOAK_PUBLIC_BASE_URL: ${KEYCLOAK_PUBLIC_BASE_URL:-}
      # Telegram bot update mode: "polling" (DEV, long-polling) or "webhook" (PRD)
      TELEGRAM_BOT_MODE: ${TELEGRAM_BOT_MODE}
      KC_TRUSTSTORE_PATHS: /opt/keycloak/certs/truststore/root-ca.crt
      # Enable Java remote debugging on port 5005
      # preferIPv4Stack: this host has no global IPv6 route, but api.telegram.org resolves to
      # an IPv6 address first, which made the Telegram bot fail to reach the API.
      JAVA_OPTS_APPEND: "-Djava.net.preferIPv4Stack=true -agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5005"
    ports:
      - "5005:5005"   # Debug port
    ##
    # Add extra hosts for keycloak to resolve to the adfs server
    ##
    extra_hosts:
      - "Window-Server-22.khalibre-ad-lab.crosswired.me:192.168.241.49"
    volumes:
      - './certs/truststore:/opt/keycloak/certs/truststore:ro'
      - './keycloak-providers:/opt/keycloak/providers'
      - './themes/khalibre:/opt/keycloak/themes/khalibre'
    labels:
      - 'multifactor-authentication.project=true'
      - 'traefik.enable=true'
      - 'traefik.http.middlewares.redirect-middleware.redirectscheme.scheme=https'
      - 'traefik.http.routers.keycloak-secure.entrypoints=websecure'
      - 'traefik.http.routers.keycloak-secure.rule=Host(`${KEYCLOAK_HOST}`)'
      - 'traefik.http.routers.keycloak-secure.service=keycloak-secure'
      - 'traefik.http.routers.keycloak-secure.tls=true'
      - 'traefik.http.routers.keycloak.entrypoints=web'
      - 'traefik.http.routers.keycloak.middlewares=redirect-middleware'
      - 'traefik.http.routers.keycloak.rule=Host(`${KEYCLOAK_HOST}`)'
      - 'traefik.http.routers.keycloak.service=keycloak'
      - 'traefik.http.services.keycloak-secure.loadbalancer.server.port=8080'
      - 'traefik.http.services.keycloak.loadbalancer.server.port=8080'
    networks:
      - mfa-network
    depends_on:
      mariadb:
        condition: service_healthy

  #
  # PrivacyIDEA
  # URL: https://${PI_HOST}
  #
  privacyidea:
    image: ${PRIVACYIDEA_IMAGE}
    container_name: mfa-privacyidea
    restart: unless-stopped
    environment:
      PI_DB_VENDOR: mariadb
      PI_DB_HOST: mariadb
      PI_DB_NAME: ${PI_DB_NAME}
      PI_DB_USER: ${PI_DB_USER}
      PI_DB_PASSWORD: ${PI_DB_PASSWORD}
      PI_PEPPER: ${PI_PEPPER}
      PI_SECRET_KEY: ${PI_SECRET_KEY}
      PI_ADMIN_USER: ${PI_ADMIN_USER}
      PI_ADMIN_PASSWORD: ${PI_ADMIN_PASSWORD}
      PI_SKIP_BOOTSTRAP: ${PI_SKIP_BOOTSTRAP}
      PI_AUTO_UPDATE: 'false'
      PI_LOGLEVEL: INFO
      PI_SUPERUSER_REALM: ${PI_SUPERUSER_REALM}
      PI_ENCFILE: /etc/privacyidea/encfile
    volumes:
      - 'privacyidea-data:/data/privacyidea'
      - './config/privacyidea/keys/encfile:/etc/privacyidea/encfile:ro'
      - './config/privacyidea/scripts:/mnt/privacyidea/scripts:ro'
      # privacyIDEA 3.12.2 sends the bare webhook content_type option ("json"/"urlencoded") as the
      # HTTP Content-Type header, which is not a valid media type, so Keycloak fails to parse it
      # and the IPN returns 500. This is the upstream fix backported from privacyidea/privacyidea
      # commit 6931e5e ("add mapping to allow use of old values"). The mapping keeps existing
      # handler rows, which store "json"/"urlencoded", working.
      # Drop this mount once PRIVACYIDEA_IMAGE moves to 3.13+, which contains the fix upstream.
      - './config/privacyidea/webhookeventhandler.py:/opt/privacyidea/lib/python3.12/site-packages/privacyidea/lib/eventhandler/webhookeventhandler.py:ro'
    labels:
      - 'multifactor-authentication.project=true'
      - 'traefik.enable=true'
      - 'traefik.http.middlewares.redirect-middleware.redirectscheme.scheme=https'
      - 'traefik.http.routers.pi-secure.entrypoints=websecure'
      - 'traefik.http.routers.pi-secure.rule=Host(`${PI_HOST}`)'
      - 'traefik.http.routers.pi-secure.service=pi-secure'
      - 'traefik.http.routers.pi-secure.tls=true'
      - 'traefik.http.routers.pi.entrypoints=web'
      - 'traefik.http.routers.pi.middlewares=redirect-middleware'
      - 'traefik.http.routers.pi.rule=Host(`${PI_HOST}`)'
      - 'traefik.http.routers.pi.service=pi'
      - 'traefik.http.services.pi-secure.loadbalancer.server.port=8080'
      - 'traefik.http.services.pi.loadbalancer.server.port=8080'
    networks:
      - mfa-network
    depends_on:
      mariadb:
        condition: service_healthy

networks:
  mfa-network:
    ipam:
      config:
        - subnet: 10.100.100.0/24

volumes:
  mariadb-data:
  privacyidea-data:
  smtp4dev-data:
