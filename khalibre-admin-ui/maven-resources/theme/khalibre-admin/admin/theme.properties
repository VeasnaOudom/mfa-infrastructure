# The EDC admin console: the stock console plus one page.
#
# Everything is inherited from keycloak.v2 - its assets, its messages, every locale it ships, and
# index.ftl. Only the two files that own the route table and the sidebar are replaced, and only at
# build time, by scripts/patch-admin-ui.mjs. Nothing here overrides them.
#
# Selected per realm, not globally: set the realm's admin theme to khalibre-admin, and only that
# realm's console loads this theme. That matters because the page behind it is a realm resource
# provider mounted on one realm, and the master realm's console is a different key space entirely.
parent=keycloak.v2

# Repeated from the parent rather than relied on from it. Theme properties are read from the theme's
# own theme.properties and the FreeMarker model binds that file's contents, so a child that leaves
# them out would render the console without its dark-mode class.
darkMode=true
kcDarkModeClass=pf-v5-theme-dark