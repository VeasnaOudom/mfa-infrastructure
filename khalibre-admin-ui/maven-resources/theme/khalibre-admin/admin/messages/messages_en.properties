edcMfaEditAppIntro=Override the MFA policy for this specific application, or inherit from the realm default.
edcMfaInheritToggle=Inherit from realm default
edcMfaAppSaved=Application policy saved.
edcMfaAppCleared=Application policy reset to inherited default.
edcMfaBottomCallout=Not stock Keycloak. This screen would be built, and it writes the same per-application configuration that option A edits by hand. If adopted, the section is better named EDC authentication than EDC Telegram.


