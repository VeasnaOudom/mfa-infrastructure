# EDC admin console messages.
#
# Only this page's own keys. Everything else - "save", "revert", "cancel", every stock console string -
# comes from the parent theme (keycloak.v2), whose messages are merged underneath ours.
#
# Read at runtime, not baked in at build time: the console fetches /resources/<realm>/admin/<locale>
# as JSON and Keycloak merges the whole parent chain, child last. So this file is read by the server
# and a missing key renders as its own key text rather than as a blank, which is why the sidebar
# entry is the first thing to check when the nav looks wrong.

edcMfaChannels=EDC MFA
edcMfaTitle=Verification channels
edcMfaIntro=Choose which second steps people in this realm may set up. A channel that is switched off is not offered during enrolment, and is withdrawn from anyone who already has it.

edcMfaChannelsCard=Channels
edcMfaNonDestructive=Switching a channel off does not delete anything anyone has already set up. Tokens and Telegram links are left in place and the channel comes straight back when it is switched on again.

edcMfaChannel_email=Email
edcMfaChannel_email_hint=A one-time code is emailed to the address on the account. Anyone with no email address on file cannot use it.
edcMfaChannel_telegram=Telegram
edcMfaChannel_telegram_hint=The EDC Telegram bot sends a one-time code to the linked chat. Needs no email address and no second app, which is why it is the recommended one here.
edcMfaChannel_totp=Authenticator app
edcMfaChannel_totp_hint=A time-based code from an authenticator app on the person's phone. The app generates the code, so nothing is delivered and nothing can go missing in transit.
# Required is a second decision, not a stronger version of the first: a channel can be available
# without being demanded. Marked as required, a user who does not have every required channel is sent
# back through the enrolment wizard once per channel - and a required channel a user cannot use is
# not held against them.
edcMfaRequired=Required
edcMfaRequired_email_hint=Users must set up email codes. Anyone with no email address on their account is exempt - they never see this option.
edcMfaRequired_telegram_hint=Users must set up Telegram. Anyone who cannot link a Telegram account is exempt.
edcMfaRequired_totp_hint=Users must set up an authenticator app. Anyone can do this - it needs no address, no phone and no second device.
edcMfaRequiredExplainer=Required channels: a user is sent through the enrolment wizard until they have set up every one of them, so two required channels means two. A required channel they cannot use is not counted against them.

edcMfaTelegramNotConfigured=The Telegram bot has no token, so Telegram cannot deliver a code even while it is switched on.
edcMfaNoneEnabled=At least one channel has to stay switched on. With every channel off, nobody would have a way to obtain a code.
edcMfaSaved=The channel settings were saved.
edcMfaSaveFailed=The channel settings could not be saved.
edcMfaLoadFailed=The channel settings could not be read\: {{error}}

edcMfaTargetLabel=Configuration Target
edcMfaTargetRealm=Realm Default (All Applications)
edcMfaTargetApp=Application\: {{name}}
edcMfaInherit=Inherit from realm default
edcMfaInheritedHint=This application currently inherits the realm-wide MFA policy. Uncheck to configure a custom policy for this application.

edcMfaTabSettings=Settings
edcMfaTabBotMessages=Bot messages
edcMfaTabApplications=Applications
edcMfaSubtitle=Option B — a built screen showing the whole policy at once
edcMfaSearchApplications=Search application
edcMfaWritesApplicationConfig=Writes each application's own configuration underneath
edcMfaColApplication=Application
edcMfaColChannels=Channels staff may set up
edcMfaColLastChanged=Last changed
# column any more - it carried one switch standing for all three channels, which was the source of
# the confusion. The marker on each chip carries the same information instead.
edcMfaChipRequired=Required
edcMfaChannelsHint=Colour shows whether ICT has left a channel switched on for this application. "Required" means a user must set that channel up. Use "Configure channels" to change either.
# This is the only place the exemption is stated, so it carries what the removed confirmation dialog
# used to: "Required" reads as absolute, and it is not.
edcMfaRequiredExplainerModal=Users must set up {{channels}}. A channel a user cannot use is not held against them - email with no address on file, or Telegram if the bot is not configured.
edcMfaConfigureChannels=Configure channels
edcMfaResetToDefault=Reset to default (Inherit)
edcMfaInherited=Inherited
