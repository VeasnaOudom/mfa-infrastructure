---
- name: Read the wildcard certificate from Vault
  community.hashi_vault.vault_kv2_get:
    url: '{{ ansible_hashi_vault_url }}'
    engine_mount_point: '{{ vault_cert_mount }}'
    path: '{{ vault_cert_path }}'
    auth_method: approle
    role_id: '{{ vault_approle_role_id }}'
    secret_id: '{{ vault_approle_secret_id }}'
  register: cert_secret
  tags: vault,get_cert
  no_log: true

- name: Ensure certificate directory exists
  ansible.builtin.file:
    path: '{{ cert_dir }}'
    state: directory
    mode: '0755'
  tags: certs,get_cert

- name: Write certificate
  ansible.builtin.copy:
    content: "{{ cert_secret.secret.cert_fullchain }}"
    dest: '{{ cert_dir }}/wildcard.crt'
    mode: '0644'
  tags: certs,get_cert

- name: Write private key
  ansible.builtin.copy:
    content: "{{ cert_secret.secret.private_key }}"
    dest: '{{ cert_dir }}/wildcard.key'
    mode: '0600'
  tags: certs,get_cert

- name: Render .env file from template
  ansible.builtin.template:
    src: .env.j2
    dest: "{{ project_dir }}/.env"
    mode: '0600'
  tags: env,get_cert

- name: Ensure MariaDB config directory exists
  ansible.builtin.file:
    path: "{{ mariadb_conf_dir }}"
    state: directory
    mode: '0755'
  tags: env,get_cert

- name: Render MariaDB small VPS config
  ansible.builtin.template:
    src: mariadb.cnf.j2
    dest: "{{ mariadb_conf_dir }}/mariadb.cnf"
    mode: '0644'
  tags: env,get_cert

- name: Ensure truststore directory exists
  ansible.builtin.file:
    path: "{{ truststore_dir | default(project_dir ~ '/certs/truststore') }}"
    state: directory
    mode: '0755'
  tags: certs,get_cert

- name: Write root CA certificate
  ansible.builtin.copy:
    content: "{{ root_ca_cert }}"
    dest: "{{ truststore_dir | default(project_dir ~ '/certs/truststore') }}/root-ca.crt"
    mode: '0644'
  when: root_ca_cert is defined and (root_ca_cert | trim | length > 0)
  tags: certs,get_cert

- name: Ensure PrivacyIDEA keys directory exists
  ansible.builtin.file:
    path: "{{ pi_keys_dir }}"
    state: directory
    mode: '0755'
  tags: env,get_cert

- name: Render PrivacyIDEA encfile from template
  ansible.builtin.template:
    src: encfile.j2
    dest: "{{ pi_keys_dir }}/encfile"
    mode: '0644'
  when: pi_encfile_b64 is defined and (pi_encfile_b64 | trim | length > 0)
  tags: env,get_cert

- name: Ensure khalibre email theme directory exists
  ansible.builtin.file:
    path: "{{ project_dir }}/themes/khalibre/email"
    state: directory
    mode: '0755'
  tags: env,get_cert

- name: Render khalibre email theme properties from template
  ansible.builtin.template:
    src: email-theme.properties.j2
    dest: "{{ project_dir }}/themes/khalibre/email/theme.properties"
    mode: '0644'
  tags: env,get_cert
