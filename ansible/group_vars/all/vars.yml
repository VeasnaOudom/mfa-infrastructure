---
ansible_hashi_vault_url: https://kms.khalibre.com
vault_role_id: "{{ vault_approle_role_id }}"
vault_secret_id: "{{ vault_approle_secret_id }}"

vault_cert_mount: certimate
vault_cert_path: crosswired.me
project_dir: "{{ playbook_dir }}/.."
cert_dir: '{{ project_dir }}/certs'
truststore_dir: '{{ project_dir }}/certs/truststore'
pi_keys_dir: '{{ project_dir }}/config/privacyidea/keys'
pi_encfile_b64: "{{ vault_pi_encfile_b64 | default('') }}"
mariadb_conf_dir: '{{ project_dir }}/config/mariadb/conf.d'


domain_name: crosswired.me
keycloak_host: "keycloak-mfa.{{ domain_name }}"
pi_host: "pi-mfa.{{ domain_name }}"
smtp4dev_host: "mfa-mail.{{ domain_name }}"

traefik_image: traefik:v3.6.2
mariadb_image: mariadb:11.8.8
keycloak_version: "26.1.3"
privacyidea_provider_version: "1.8.0"
app_version: "{{ keycloak_version }}-pi-{{ privacyidea_provider_version }}"
keycloak_docker_image: khalibre/mfa-keycloak
keycloak_image: "{{ keycloak_docker_image }}:{{ app_version }}"
privacyidea_image: khalibre/privacyidea:3.12.2
smtp4dev_image: rnwood/smtp4dev:3.16.0-ci20260925100_pr2130

traefik_http_port: 80
traefik_https_port: 443
traefik_dashboard_port: 8080

mariadb_port: 3306
mariadb_innodb_buffer_pool_size: 256M
mariadb_innodb_log_file_size: 128M
mariadb_max_connections: 100
mariadb_thread_cache_size: 16
mariadb_table_open_cache: 400
mariadb_tmp_table_size: 64M
mariadb_max_heap_table_size: 64M

keycloak_db_name: keycloak
keycloak_db_user: keycloak
telegram_bot_mode: polling
pi_db_name: privacyidea
pi_db_user: privacyidea

keycloak_admin: admin
pi_admin_user: admin
pi_skip_bootstrap: false
pi_superuser_realm: "admin,platform"

# Public origin for links and images in Keycloak-generated mail, rendered into
# themes/khalibre/email/theme.properties. Traefik terminates TLS on 443, so https with no port.
# Derived from keycloak_host so it cannot disagree with KEYCLOAK_HOST in .env for a given host.
# Override domain_name (or this) per environment.
keycloak_public_base_url: "https://{{ keycloak_host }}"

mysql_root_password: "{{ vault_mysql_root_password }}"
keycloak_db_password: "{{ vault_keycloak_db_password }}"
pi_db_password: "{{ vault_pi_db_password }}"
keycloak_admin_password: "{{ vault_keycloak_admin_password }}"
pi_admin_password: "{{ vault_pi_admin_password }}"
pi_pepper: "{{ vault_pi_pepper }}"
pi_secret_key: "{{ vault_pi_secret_key }}"
# Shared HMAC key for the /ipn webhook and the resend endpoint. Defaults to
# empty so a Vault entry that has not been created yet cannot break .env
# rendering, but an empty value means the webhook accepts any request, so it
# must be set in Vault before deploying anywhere real.
privacyidea_webhook_secret: "{{ vault_privacyidea_webhook_secret | default('wSWIpdo4epG8Ow0r73_enco7QMUKMVnuFRLhQ1xxdd0') }}"

root_ca_cert: "{{ vault_root_ca_cert }}"
